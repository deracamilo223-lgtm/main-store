<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Main Store</title>
    <link rel="icon" type="image/png" href="icons/icon.png">
</head>
<body>

    <h3>Register User</h3>

    <form action="signup.php" method="post">
        <label>Firstname:</label><br>
        <input type="text" name="fname" required><br><br>

        <label>Lastname:</label><br>
        <input type="text" name="lname" required><br><br>

        <label>Identification Number:</label><br>
        <input type="text" name="idnumber" required><br><br>

        <label>Mobile Phone:</label><br>
        <input type="text" name="mphone" required><br><br>

        <label>E-mail:</label><br>
        <input type="email" name="email" required><br><br>

        <label>Password:</label><br>
        <input type="password" name="pswd" required><br><br>

        <button type="submit">Register</button>
    </form>

    <p><a href="../index.htm">← Volver al inicio</a></p>

</body>
</html>
